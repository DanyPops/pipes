name: CI

# Runs on every push/PR -- pipes previously had no pre-merge CI at all,
# only publish.yml's tag-triggered per-package test+typecheck.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check out the Pi TUI test harness
        run: git clone --depth 1 https://github.com/DanyPops/pi-integral.git ../pi-integral
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: npm run lint:ci
      - run: npm run check
      - run: npm run test
